[package]
name = "dexxer_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dexxer_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust]
unexpected_cfgs = "allow"

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token", "associated_token"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }
# Already in the lock transitively (via ephemeral-rollups-sdk); pinned as a direct
# dependency here for `pda::CRANK_SIGNER` (crank_tick's scheduler-PDA auth check).
magicblock-magic-program-api = "=0.10.1"
# anchor-lang 1.0.2 does not re-export solana_program::keccak (its solana_program
# shim only re-exports the decomposed crates it lists); pull the hasher directly.
# Version already resolved transitively (via ephemeral-rollups-sdk's solana-program
# dependency), so this adds no new entry to the dependency graph.
solana-keccak-hasher = "=3.1.0"
# `#[account(zero_copy)]` (state/balances_root.rs, week-3 task 5, controller
# ruling 5) expands to `unsafe impl bytemuck::Pod/Zeroable` referencing the
# `bytemuck` crate by name — anchor-lang re-exports it internally but the
# macro output still needs it resolvable as a direct dependency here. Pinned
# to the version already resolved transitively (via anchor-lang), so this
# adds no new entry to the dependency graph.
bytemuck = "=1.25.2"
# pinned: anchor-lang 1.0.2 requires ^1.0.2 and 1.2.0 macros break mint:: codegen
anchor-syn = "=1.0.2"
anchor-derive-accounts = "=1.0.2"
anchor-derive-serde = "=1.0.2"
anchor-derive-space = "=1.0.2"
anchor-attribute-access-control = "=1.0.2"
anchor-attribute-account = "=1.0.2"
anchor-attribute-constant = "=1.0.2"
anchor-attribute-error = "=1.0.2"
anchor-attribute-event = "=1.0.2"
anchor-attribute-program = "=1.0.2"

[dev-dependencies]
proptest = "1.5"
