[package]
name = "dexxer_litesvm"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.16.0"
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }
dexxer_core = { path = "../../programs/dexxer_core", features = ["no-entrypoint"] }
solana-pubkey = "4"
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "3"
solana-message = "4"
solana-transaction = "4"
solana-account = "4"
solana-clock = "3"
solana-system-interface = "3"
