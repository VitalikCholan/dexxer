[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.9"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
dexxer_core = "G2okX5Bae4CxfK8vzso1Ecc96QUv7E3P4YvxaZnaYXoV"
mock_oracle = "68xBWNR1uKorC7keLWvsT1pCmKC4RnwvRF4LoV3CCprh"

# mock_oracle is localnet/LiteSVM-only (see keys/README.md); devnet uses the
# real Pyth Lazer feed instead, so only dexxer_core deploys there.
[programs.devnet]
dexxer_core = "G2okX5Bae4CxfK8vzso1Ecc96QUv7E3P4YvxaZnaYXoV"

# Stays "localnet" by default (week-1 behaviour unchanged); pass
# `--provider.cluster devnet` on the command line for devnet deploys.
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
